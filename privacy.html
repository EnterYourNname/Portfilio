  <script type="text/babel" data-presets="env,react">
    function PrivacyPage() {
      const [navOpen, setNavOpen] = React.useState(false);
      const scrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
      return (
        <div className="app-shell">
          <div className="phone legal-phone">

            <NavOverlay open={navOpen} onClose={() => setNavOpen(false)} />

              <p className="pk-mono legal-eyebrow">Legal</p>
              <h1 className="legal-heading">Privacy Policy</h1>
              <p className="legal-intro">Last updated: May 2026</p>

              <section className="legal-section">
                <h2 className="legal-label">1. Controller</h2>
                <p>Andrii Borysov<br />Autenstraße 22, 71254 Ditzingen, Germany<br />
                <a href="mailto:andrii.b.design@gmail.com" className="legal-link">andrii.b.design@gmail.com</a></p>
                <p>This is a private portfolio website with no commercial activity.</p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">2. What data we process</h2>
                <p>This site does not use analytics, advertising networks, or tracking cookies. The only third-party services that may process data are listed below.</p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">3. Hosting — GitHub Pages</h2>
                <p>This site is hosted by GitHub Pages (GitHub, Inc., 88 Colin P Kelly Jr St, San Francisco, CA 94107, USA). GitHub may automatically collect server log data including IP addresses, browser type, referring pages, and request timestamps when you visit this site.</p>
                <p>Legal basis: Art. 6(1)(f) GDPR — legitimate interest in operating the website.<br />
                <a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement" target="_blank" rel="noopener" className="legal-link">GitHub Privacy Statement →</a></p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">4. Embedded video — Vimeo</h2>
                <p>This site embeds a video hosted by Vimeo LLC (555 West 18th Street, New York, NY 10011, USA). The Vimeo player only loads when you explicitly click play and have accepted cookies via the consent banner. Until then, no data is transferred to Vimeo.</p>
                <p>When the player loads, Vimeo may set cookies and collect data such as your IP address, browser type, and viewing behaviour in accordance with their privacy policy.</p>
                <p>Legal basis: Art. 6(1)(a) GDPR — your consent.<br />
                <a href="https://vimeo.com/privacy" target="_blank" rel="noopener" className="legal-link">Vimeo Privacy Policy →</a></p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">5. Contact form — Formspree</h2>
                <p>The contact form is powered by Formspree, Inc. (2021 Fillmore St #1006, San Francisco, CA 94115, USA). When you submit the form, your name, email, phone number, and message are transmitted to and stored on Formspree's servers so the message can be forwarded to us.</p>
                <p>This data is used solely to respond to your inquiry. It is not shared with third parties for marketing and is deleted once no longer needed.</p>
                <p>Legal basis: Art. 6(1)(b) GDPR — processing necessary for responding to your request.<br />
                <a href="https://formspree.io/legal/privacy-policy" target="_blank" rel="noopener" className="legal-link">Formspree Privacy Policy →</a></p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">6. JavaScript libraries — unpkg CDN</h2>
                <p>This site loads open-source libraries (React, Babel) from unpkg.com, a CDN operated by Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA). Cloudflare may process your IP address to serve these files.</p>
                <p>Legal basis: Art. 6(1)(f) GDPR — legitimate interest in delivering the website.<br />
                <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener" className="legal-link">Cloudflare Privacy Policy →</a></p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">7. Cookie consent storage</h2>
                <p>Your cookie preference (accept or decline) is stored in your browser's localStorage. This is technically necessary to remember your choice and does not transmit any data to external servers.</p>
              </section>

              <section className="legal-section">
                <h2 className="legal-label">8. Your rights under GDPR</h2>
                <p>You have the right to request access to, rectification of, or erasure of your personal data. You also have the right to restrict or object to processing, and the right to data portability. To exercise any of these rights, contact: <a href="mailto:andrii.b.design@gmail.com" className="legal-link">andrii.b.design@gmail.com</a></p>

                <h2 className="legal-label">9. Right to lodge a complaint</h2>
                <p>You have the right to lodge a complaint with the data protection supervisory authority in Baden-Württemberg:</p>

    root.render(<PrivacyPage />);

  <div id="ck-root"></div>
